
spring.profiles.active=test
spring.application.name=securevault

# H2 Database
spring.datasource.url=jdbc:h2:mem:securevault;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=MySecureVaultSecretKeyForJWTAuthentication2026SecureVaultProject
jwt.expiration=86400000

# AES
aes.key=1234567890123456

# Disable Redis for tests
spring.cache.type=none