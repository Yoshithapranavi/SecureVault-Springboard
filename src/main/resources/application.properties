spring.application.name=securevault

# =========================================================
# SERVER
# =========================================================

server.port=8081


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/securevault
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# =========================================================
# AES ENCRYPTION
# =========================================================

aes.key=${AES_KEY}
aes.key.v2=${AES_KEY_V2}


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis


# =========================================================
# EMAIL / MFA
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=securevault.project2026@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Use PLAIN authentication with Gmail App Password
spring.mail.properties.mail.smtp.auth.mechanisms=PLAIN
spring.mail.properties.mail.smtp.auth.plain.disable=false
spring.mail.properties.mail.smtp.auth.login.disable=true
# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG


# =========================================================
# GOOGLE OAUTH2
# =========================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

